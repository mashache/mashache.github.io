<!doctype html>
<html lang="en">
  <head>
    {% include head.html %}
  </head>
  <body>
    <header class="site-header">
  <div class="profile-block">
    <img src="{{ '/assets/img/profile.jpg' | relative_url }}" alt="Profile photo" class="profile-photo">

    <div class="profile-info">
      <h1>
        <a href="{{ '/' | relative_url }}">Maria (Masha) Cheremisinova</a>
      </h1>

      <p>Universitat Politècnica de València</p>
      <p><a href="mailto:your@email.com">your@email.com</a></p>
      <p><a href="{{ '/assets/cv.pdf' | relative_url }}">CV</a></p>
    </div>
  </div>

  <nav class="site-menu">
    {% for p in site.header_pages %}
      {% assign my_page = site.pages | where: "path", p | first %}
      {% if my_page %}
        <a href="{{ my_page.url | relative_url }}">{{ my_page.title }}</a>
      {% endif %}
    {% endfor %}
  </nav>
</header>
    <main aria-label="Content">
      {{ content }}
    </main>
  </body>
</html>
