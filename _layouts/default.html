<!doctype html>
<html lang="en">
  <head>
    {% include head.html %}
  </head>
  <body>
    <header class="site-header">
  <div class="profile-block">
  <img src="{{ site.photo | relative_url }}" class="profile-photo">

  <div class="profile-info">
    <h1>
      <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
    </h1>

    <p>{{ site.affiliation }}</p>

    <p>
      <a href="mailto:{{ site.email }}">{{ site.email }}</a>
    </p>

    <p>
      <a href="{{ site.cv | relative_url }}">CV</a>
    </p>
  </div>
</div>

  <nav class="site-menu">
    {% for p in site.header_pages %}
      {% assign my_page = site.pages | where: "path", p | first %}
      {% if my_page %}
        <a href="{{ my_page.url | relative_url }}">{{ my_page.title }}</a>
      {% endif %}
    {% endfor %}
  </nav>
</header>
    <main aria-label="Content">
      {{ content }}
    </main>
  </body>
</html>
